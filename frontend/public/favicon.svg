  <circle cx="28" cy="14" r="1.6" fill="#00f5a0"/>
  <circle cx="28" cy="14" r="0.8" fill="#ffffff"/>

  <!-- 3/4 Coach Bus Silhouette (Optimized for 32x32) -->
