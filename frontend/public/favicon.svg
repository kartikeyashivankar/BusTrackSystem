    <ellipse cx="95" cy="120" rx="5" ry="7" fill="#00f5a0"/>
    <ellipse cx="144" cy="112" rx="5" ry="7.2" fill="#060b14"/>
    <ellipse cx="144" cy="112" rx="3" ry="5" fill="#00f5a0"/>
